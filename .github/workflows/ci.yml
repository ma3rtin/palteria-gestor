name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Esperar a que postgres esté listo y saludable antes de correr los jobs
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Git pueda auditar las ramas/diffs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Destructive Migrations Linter
        run: node scripts/check-destructive-migrations.mjs

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate database schema deployment (Migrate Deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"

      - name: Run Vitest tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"
          NEXTAUTH_SECRET: "mock_secret_key_minimum_32_characters_long"

      - name: Deploy Migrations to Production Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}

